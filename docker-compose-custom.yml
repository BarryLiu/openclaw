# 创建外部网络 openclaw_net（如果不存在）:
# docker network create --driver bridge --subnet=172.33.0.0/16 --gateway=172.33.0.1 openclaw_net
#
# 构建（支持 Linux amd64 服务器）:
#   docker compose -f docker-compose-custom.yml build
# 启动:
#   docker compose -f docker-compose-custom.yml up -d
#
# 构建时可传环境变量: OPENCLAW_EXTENSIONS, OPENCLAW_INSTALL_DOCKER_CLI, OPENCLAW_DOCKER_APT_PACKAGES

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        OPENCLAW_EXTENSIONS: ${OPENCLAW_EXTENSIONS:-}
        OPENCLAW_INSTALL_DOCKER_CLI: ${OPENCLAW_INSTALL_DOCKER_CLI:-}
        OPENCLAW_DOCKER_APT_PACKAGES: ${OPENCLAW_DOCKER_APT_PACKAGES:-}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${TZ:-Asia/Shanghai}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /etc/localtime:/etc/localtime:ro
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## docker-setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
      # group_add:
      #   - "${DOCKER_GID:-999}"
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    networks:
      - openclaw_net
    command: [ "node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789" ]
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  # openclaw-cli:
  #   image: ${OPENCLAW_IMAGE:-openclaw:local}
  #   network_mode: "service:openclaw-gateway"
  #   cap_drop:
  #     - NET_RAW
  #     - NET_ADMIN
  #   security_opt:
  #     - no-new-privileges:true
  #   environment:
  #     HOME: /home/node
  #     TERM: xterm-256color
  #     OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
  #     OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
  #     BROWSER: echo
  #     CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
  #     CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
  #     CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
  #   volumes:
  #     - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
  #     - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
  #   stdin_open: true
  #   tty: true
  #   init: true
  #   entrypoint: [ "node", "dist/index.js" ]
  #   depends_on:
  #     - openclaw-gateway

networks:
  openclaw_net:
    external: true
    name: openclaw_net
    driver_opts:
      com.docker.network.bridge.name: openclaw_net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.33.0.0/16
          gateway: 172.33.0.1
