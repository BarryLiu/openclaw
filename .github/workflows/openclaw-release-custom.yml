# 使用 docker-compose-custom.yml 构建并推送到指定镜像仓库
# 需在仓库 Settings -> Secrets 中配置: REGISTRY_USERNAME, REGISTRY_PASSWORD
name: Build and Push (docker-compose-custom)

on:
  workflow_dispatch:
    inputs:
      imageTag:
        default: "custom-2026-03-17"
        description: "Image tag (e.g. custom-2026-03-17)"
        required: true
      registry:
        default: "registry.cn-shanghai.aliyuncs.com"
        description: "Registry host (e.g. registry.cn-shanghai.aliyuncs.com or docker.io)"
        required: true
      imageName:
        default: "deployapps/openclaw"
        description: "Image name (registry 后的仓库路径，如 deployapps/openclaw)"
        required: true
      pushLatest:
        description: "Also push as :latest"
        default: "false"
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build with docker-compose-custom.yml
        run: |
          export OPENCLAW_IMAGE="${{ github.event.inputs.registry }}/${{ github.event.inputs.imageName }}:${{ github.event.inputs.imageTag }}"
          docker compose -f docker-compose-custom.yml build

      - name: Push image
        run: |
          export OPENCLAW_IMAGE="${{ github.event.inputs.registry }}/${{ github.event.inputs.imageName }}:${{ github.event.inputs.imageTag }}"
          docker compose -f docker-compose-custom.yml push

      - name: Push latest tag
        if: github.event.inputs.pushLatest == 'true'
        run: |
          FULL="${{ github.event.inputs.registry }}/${{ github.event.inputs.imageName }}:${{ github.event.inputs.imageTag }}"
          LATEST="${{ github.event.inputs.registry }}/${{ github.event.inputs.imageName }}:latest"
          docker tag "$FULL" "$LATEST"
          docker push "$LATEST"
